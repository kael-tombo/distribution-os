# Continuous integration for Distribution OS.
#
# Runs on every push to `main` and on every pull request targeting `main`.
# Uses the same typecheck, lint, Worker build and full TS/MJS test gate as Docker.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same workflow + ref so force-pushes and
# rebases do not burn CI minutes on superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · Lint · Build · Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Linux system dependencies
        run: |
          set -euo pipefail
          for bin in flock timeout curl sha256sum node npm; do
            command -v "$bin" >/dev/null || {
              echo "Required binary '$bin' is missing on the runner." >&2
              exit 69
            }
          done
          echo "All Sites runtime prerequisites are available."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Verify release
        env:
          SITES_BUILD_TIMEOUT_MS: 300000
          WRANGLER_SEND_METRICS: "false"
        run: npm run verify

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
